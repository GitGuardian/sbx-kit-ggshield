name: Secret scan

# Scans every pushed commit for hardcoded secrets with ggshield.
#
# This repo ships a secret scanner; it should not be the thing that leaks a key.
# The kit already puts ggshield on the agent's own output path inside the
# sandbox (the AI hook), and `.gitignore` keeps `.env` out of commits - this
# workflow closes the last gap, the commits that actually reach GitHub.
#
# The action is the one published from the ggshield repo itself
# (`actions/secret`): a Docker action that runs `ggshield secret scan -v ... ci`
# over the commit range of the event. The env block below is what ggshield's own
# CI passes to it; each variable feeds the range computation:
#
#   GITHUB_PUSH_BEFORE_SHA   push events: the branch tip before the push, so the
#                            scan covers every commit in the push, not just HEAD
#   GITHUB_PUSH_BASE_SHA     the push's base, used when a branch is new
#   GITHUB_DEFAULT_BRANCH    fallback base when neither of the above resolves
#                            (e.g. the first push of a brand-new branch)
#
# Pull requests need no extra variable: ggshield derives the base from
# GITHUB_BASE_REF, which GitHub sets on `pull_request` runs.
#
# Setup required once, in the GitHub repo (Settings -> Secrets and variables ->
# Actions):
#   secret  GITGUARDIAN_API_KEY  a GitGuardian API key with the `scan` scope.
#                                Use a scan-only Service Account token - the
#                                same least-privilege rule the README applies
#                                to the key you bind into the sandbox. A
#                                workspace-wide PAT parked in CI defeats the
#                                point.
# For the EU workspace or a self-hosted instance, also add
# `GITGUARDIAN_INSTANCE: ${{ secrets.GITGUARDIAN_INSTANCE }}` to the env block
# below (same host you add to the kit's network allowlist).

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: ggshield secret scan
    # Secrets are not exposed to workflows triggered by a pull request from a
    # fork, so GITGUARDIAN_API_KEY would be empty and the scan would fail as
    # unauthenticated rather than come back clean. Commits from a fork are still
    # scanned by the `push` run once they land in this repo. This is the same
    # guard ggshield's own CI uses.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # ggshield walks the commit range with git, so the full history must
          # be present. The default shallow clone makes the range unresolvable.
          fetch-depth: 0

      - name: Scan commits for hardcoded secrets
        uses: GitGuardian/ggshield/actions/secret@efc667f656e64e9587d92da3630b00a3f5f52e6e
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
