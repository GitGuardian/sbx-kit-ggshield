name: Publish kit

# Publishes the kit OCI artifact to Docker Hub.
#
# The kit is a v3 kit: one OCI image built by `docker buildx` from
# gitguardian.yaml. One kit, one repo - the kit is agent-agnostic, so there is
# nothing to fan out over.
#
# Setup required once, in the GitHub repo (Settings -> Environments -> release).
# All three are environment SECRETS, so only the jobs that declare
# `environment: release` below can read them:
#   secret DOCKERHUB_USERNAME   the Docker Hub account used to log in; it must
#                               have push rights in the target namespace
#   secret DOCKERHUB_TOKEN      a Docker Hub access token with Read & Write
#   secret DOCKERHUB_NAMESPACE  optional; overrides the default `gitguardian`
#                               namespace (e.g. to publish from a fork). Being a
#                               secret, it is masked as *** everywhere it is
#                               echoed - including the published `sbx run`
#                               command in the job summary.
#
# See PUBLISHING.md for the full story.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Docker Hub namespace (default: DOCKERHUB_NAMESPACE secret, else gitguardian)"
        type: string
        required: false
      tag:
        description: "Tag to publish"
        type: string
        default: latest
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "gitguardian.yaml"
      - "gitguardian.dockerfile"
      - "gitguardian-context.md"
      - "scripts/**"
      - ".github/**"

concurrency:
  group: publish-kit
  cancel-in-progress: false

permissions:
  contents: read

env:
  KIT_REPO_NAME: ggshield-kit
  # Same default as scripts/publish.sh. Override per-repo with the
  # DOCKERHUB_NAMESPACE secret, or per-run with the `namespace` input.
  KIT_NAMESPACE_DEFAULT: gitguardian

jobs:
  validate:
    name: Validate kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build the kit
        # The frontend validates the descriptor, then builds the recipe
        # (download, SHA256 check, version assertion) for both platforms.
        run: docker buildx build . -f gitguardian.yaml --platform linux/amd64,linux/arm64 --output type=cacheonly

  publish:
    name: Publish to Docker Hub
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The Docker Hub credentials live in this environment, not at repo level:
    # `secrets.DOCKERHUB_*` below resolve only for a job bound to it. Anything
    # configured on the environment (required reviewers, branch restrictions)
    # therefore gates every push of the kit artifact.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Resolve target namespace
        id: target
        env:
          INPUT_NAMESPACE: ${{ inputs.namespace }}
          VAR_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
        run: |
          ns="${INPUT_NAMESPACE:-${VAR_NAMESPACE:-$KIT_NAMESPACE_DEFAULT}}"
          if [ -z "$ns" ]; then
            echo "::error::No namespace resolved." >&2
            exit 1
          fi
          echo "namespace=$ns" >>"$GITHUB_OUTPUT"
          echo "Publishing to docker.io/$ns/$KIT_REPO_NAME"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the kit
        id: push
        run: |
          # Without pipefail the pipeline reports `tee`'s status, so a failing
          # publish.sh (a rejected push, a missing signing identity) left this
          # step green and the later digest summary empty.
          set -o pipefail
          ./scripts/publish.sh \
            "${{ steps.target.outputs.namespace }}" \
            "${{ inputs.tag || 'latest' }}" | tee publish.log

      - name: Check the repo is public
        # Docker Hub creates a new repo with the namespace's default privacy,
        # which may be Private. An unauthenticated read only succeeds if public.
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          url="https://hub.docker.com/v2/repositories/${NAMESPACE}/${KIT_REPO_NAME}/"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
          if [ "$code" != "200" ]; then
            echo "::error::${NAMESPACE}/${KIT_REPO_NAME} is not publicly readable (HTTP $code). Make the repository Public in Docker Hub, and set the namespace's default repository privacy to Public so future pushes stay public." >&2
            exit 1
          fi
          echo "docker.io/${NAMESPACE}/${KIT_REPO_NAME} is public."

      - name: Summarise the published digest
        if: steps.push.outcome == 'success'
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' publish.log | tail -1)"
          {
            echo "## Published kit artifact"
            echo
            echo '```'
            echo "sbx run claude --kit \"oci://docker.io/${NAMESPACE}/${KIT_REPO_NAME}:latest\" ."
            echo '```'
            echo
            echo "Digest: \`${digest}\`"
          } >>"$GITHUB_STEP_SUMMARY"

  description:
    name: Sync Docker Hub overview
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Same credentials, same environment - this job authenticates to the Docker
    # Hub API with DOCKERHUB_USERNAME/TOKEN too.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Push docs/dockerhub-overview.md as the repo overview
        env:
          NAMESPACE: ${{ inputs.namespace || secrets.DOCKERHUB_NAMESPACE || 'gitguardian' }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          token="$(jq -n --arg u "$USERNAME" --arg p "$TOKEN" '{identifier:$u,secret:$p}' \
            | curl -sf -H 'Content-Type: application/json' -d @- \
                https://hub.docker.com/v2/auth/token \
            | jq -r .access_token)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Could not obtain a Docker Hub API token." >&2
            exit 1
          fi
          # Use the namespace-scoped route, not the legacy
          # /v2/repositories/<ns>/<repo>/ one: that path rejects any JWT minted
          # from an access token ("token issued from organization access token
          # is not allowed"), whatever scopes the token carries - only a
          # username+password session may PATCH there. The route below accepts
          # the same token, provided it has Read & Write on this repository.
          code="$(jq -n \
            --rawfile body docs/dockerhub-overview.md \
            --arg short "GitGuardian (ggshield) secret scanning as a Docker Sandboxes kit" \
            '{full_description:$body, description:$short}' \
          | curl -s -o response.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              -d @- \
              "https://hub.docker.com/v2/namespaces/${NAMESPACE}/repositories/${KIT_REPO_NAME}")"
          case "$code" in
            2*) ;;
            *)
              # The previous `curl -sf ... >/dev/null` discarded both status and
              # body, leaving nothing in the log but curl's exit 22.
              echo "::error::Docker Hub refused the overview update (HTTP $code): $(cat response.json)" >&2
              exit 1
              ;;
          esac
          echo "Overview synced to docker.io/${NAMESPACE}/${KIT_REPO_NAME}"
